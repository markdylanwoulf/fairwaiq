function lerp(t,v){if(!t||!t.length)return 2.5;if(v<=t[0][0])return t[0][1];if(v>=t[t.length-1][0])return t[t.length-1][1];for(let i=0;i<t.length-1;i++)if(v>=t[i][0]&&v<=t[i+1][0]){const f=(v-t[i][0])/(t[i+1][0]-t[i][0]);return t[i][1]+f*(t[i+1][1]-t[i][1]);}return t[t.length-1][1];}
function expS(bl,lie,dist,par=4){if(lie==="Holed")return 0;if(lie==="Green")return lerp(bl.putt,dist);if(lie==="Tee")return lerp((bl.tee[par>=5?5:par<=3?3:4])||bl.tee[4],dist);return lerp((bl.app[lie])||bl.app.Fairway,dist);}

function holeStrokes(hh){return(hh.shots||[]).reduce((a,s)=>a+1+(s.penalty||0),0)+(hh.totalPutts||0);}

function calcSG(holes,blKey="hdcp15"){
  const bl=BL[blKey];let sg={tee:0,approach:0,around:0,putting:0};
  holes.forEach(hh=>{
    (hh.shots||[]).forEach((s,i)=>{
      if(s.startDist==null)return;
      const nx=hh.shots[i+1];
      let la,da;
      if(nx){la=nx.lie;da=nx.startDist;}
      else if(hh.totalPutts!=null&&hh.firstPuttDist!=null){la="Green";da=hh.firstPuttDist;}
      else{la="Holed";da=0;}
      const eb=expS(bl,s.lie,s.startDist,hh.par);
      const ea=la==="Holed"?0:expS(bl,la,da,hh.par);
      const g=eb-ea-(1+(s.penalty||0));
      if(s.lie==="Tee"&&hh.par>=4)sg.tee+=g;
      else if(s.lie==="Green")sg.putting+=g;
      else if(["Fringe"].includes(s.lie)||(s.startDist<=30&&s.lie!=="Tee"))sg.around+=g;
      else sg.approach+=g;
    });
    if(hh.totalPutts!=null&&hh.firstPuttDist!=null)sg.putting+=expS(bl,"Green",hh.firstPuttDist,hh.par)-hh.totalPutts;
  });
  return Object.fromEntries(Object.entries(sg).map(([k,v])=>[k,+v.toFixed(2)]));
}
function calcStats(holes){
  let score=0,par=0,fwy=0,fa=0,gir=0,ga=0,putts=0,played=0,dd=[],cm={};
  holes.forEach(hh=>{
    if(!hh.shots?.length&&hh.totalPutts==null)return;
    played++;score+=holeStrokes(hh);par+=hh.par;
    if(hh.par>=4){fa++;if(hh.shots?.[0]?.resultLie==="Fairway")fwy++;}
    ga++;if(hh.shots?.slice(0,hh.par-2).some(s=>s.resultLie==="Green"))gir++;
    putts+=hh.totalPutts||0;
    if(hh.shots?.[0]?.shotDist&&hh.par>=4)dd.push(hh.shots[0].shotDist);
    hh.shots?.forEach(s=>{if(!s.club)return;if(!cm[s.club])cm[s.club]={shots:0};cm[s.club].shots++;});
  });
  return{score,par,toPar:score-par,played,fwyPct:fa?Math.round(fwy/fa*100):0,girPct:ga?Math.round(gir/ga*100):0,putts,avgDrive:dd.length?Math.round(dd.reduce((a,b)=>a+b,0)/dd.length):null,clubMap:cm};
}

async function ghinLogin(emailOrGhin,pass){
  let res;
  try{
    res=await fetch("https://api.ghin.com/api/v1/golfer_user/golfer_user_token.json",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({user:{email_or_ghin:emailOrGhin,password:pass,remember_me:true}})
    });
  }catch(netErr){throw new Error("Network error: "+netErr.message);}
  const d=await res.json().catch(()=>({}));
  if(!res.ok){
    const msg=d.error||d.message
      ||(d.errors&&(Array.isArray(d.errors)?d.errors[0]:Object.values(d.errors)[0]))
      ||"Login failed (HTTP "+res.status+")";
    throw new Error(msg);
  }
  const token=d.golfer_user_token?.token;
  const golfer=d.golfer_user_token?.golfer_user;
  if(!token)throw new Error("No token returned — verify your email and password at ghin.com");
  return {token,golfer};
}

    throw new Error("Network error — "+netErr.message+". On Android, try opening the file in Chrome and enabling 'Allow all cookies' in Chrome settings.");

// ── COURSE SELECTOR ──────────────────────────────────────────────
function CourseSelector({saved,onSave,onSelect,back}){
  const [view,setView]=useState(saved.length>0?"list":"new");
  const [step,setStep]=useState(0);
  const [searching,setSearching]=useState(false);
  const [searchErr,setSearchErr]=useState("");
  const [name,setName]=useState(""); const [city,setCity]=useState(""); const [state,setState]=useState("");
  const [slope,setSlope]=useState(""); const [rating,setRating]=useState("");
  const [pars,setPars]=useState(Array(18).fill(4));
  const [yardages,setYardages]=useState(Array(18).fill(""));
  const [teeOptions,setTeeOptions]=useState([]); // all tees from API
  const [rawHoles,setRawHoles]=useState({});     // map tee index → holes array
  const yardRefs=useRef([]);

  function cyclePar(i){setPars(p=>{const n=[...p];n[i]=n[i]===3?4:n[i]===4?5:3;return n;});}
  function setYard(i,v){setYardages(y=>{const n=[...y];n[i]=v;return n;});}
  const totalPar=pars.reduce((a,b)=>a+b,0);
  const canGo=name.trim()&&slope&&rating;

  // ── Course lookup via Anthropic API + web search ──
  async function lookupCourse(){
    if(!name.trim())return;
    setSearching(true);setSearchErr("");

    // ── Try GolfCourseAPI first ──
    const gcKey=getGcKey();
    if(gcKey){
      try{
        // Search by name only — city often causes misses
        const q=encodeURIComponent(name.trim());
        const res=await fetch(`https://api.golfcourseapi.com/v1/search?search_query=${q}`,{
          headers:{"Authorization":"Key "+gcKey}
        });
        if(!res.ok)throw new Error("Search error "+res.status+": "+await res.text());
        const data=await res.json();
        // DEBUG - show raw search response
        alert("SEARCH: "+JSON.stringify(data).slice(0,800));
        const courses=data.courses||data.results||(Array.isArray(data)?data:[]);
        if(!courses.length)throw new Error("No courses found for '"+name.trim()+"' — try full name e.g. 'Indian Peaks Golf Course'");

        const course=courses[0];
        const courseId=course.id||course.course_id||course.CourseID;
        if(!courseId)throw new Error("No course ID in search results");

        // Try detail endpoint first, fall back to using search result directly
        let tees=[];
        let courseMeta=course;
        try{
          const res2=await fetch(`https://api.golfcourseapi.com/v1/courses/${courseId}`,{
            headers:{"Authorization":"Key "+gcKey}
          });
          if(res2.ok){
            const detail=await res2.json();
            tees=detail.tees||[];
            if(tees.length)courseMeta=detail;
          }
        }catch(e){}

        // If detail had no tees, check if search result itself has tee data
        if(!tees.length){
          // Sometimes the search returns tees embedded in each course result
          if(Array.isArray(courses[0]?.tees))tees=courses[0].tees;
          else if(Array.isArray(data.tees))tees=data.tees;
        }

        if(!tees.length)throw new Error("No tee data found — try searching the full course name e.g. 'Indian Peaks Golf Course'");

        // Build hole map for each tee
        const holeMap={};
        tees.forEach((t,ti)=>{
          const hs=t.holes||[];
          const pa=Array(18).fill(4);
          const ya=Array(18).fill(0);
          hs.forEach((h,idx)=>{if(idx<18){pa[idx]=parseInt(h.par)||4;ya[idx]=parseInt(h.yardage)||0;}});
          holeMap[ti]={
            pars:pa,yardages:ya,
            slope:+(t.slope_rating||113),
            rating:+(t.course_rating||72),
            totalYds:+(t.total_yards||ya.reduce((a,b)=>a+b,0)),
            par:+(t.par_total||pa.reduce((a,b)=>a+b,0))
          };
        });
        setTeeOptions(tees);setRawHoles(holeMap);

        setName(courseMeta.course_name||courseMeta.club_name||courseMeta.name||course.name||name);
        setCity(courseMeta.city||course.city||city);
        setState(courseMeta.state||course.state||state);

        // Pre-fill with first tee as default
        const d0=holeMap[0]||{};
        setPars(d0.pars||Array(18).fill(4));
        setYardages((d0.yardages||Array(18).fill(0)).map(y=>""+y));
        setSlope(d0.slope?""+d0.slope:"");
        setRating(d0.rating?""+d0.rating:"");

        setSearchErr("FOUND_GC");setSearching(false);
        if(tees.length>1){setStep(0.5);}
        return;
      }catch(e){
        setSearchErr("GolfCourseAPI: "+e.message);
        setSearching(false);return;
      }
    }

    // ── Fallback: Anthropic ──
    if(!getApiKey()){
      setSearchErr("Add your GolfCourseAPI key or Anthropic key in Settings to enable course search.");
      setSearching(false);return;
    }
    try{
      const key=getApiKey();
      const q=name.trim()+(city?" "+city:"")+(state?" "+state:"");
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:350,
          system:'Golf course database. Reply ONLY with raw JSON:\n{"name":"","city":"","state":"","slope":0,"rating":0.0,"pars":[18 ints],"yardages":[18 ints]}\nMiddle tee. Exactly 18 values each.',
          messages:[{role:"user",content:q}]})
      });
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||"API error "+res.status);}
      const data=await res.json();
      const raw=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      const m=raw.replace(/```[\w]*\n?/g,"").replace(/```/g,"").trim().match(/\{[\s\S]*\}/);
      if(!m)throw new Error("No course data returned");
      const c=JSON.parse(m[0]);
      if(!Array.isArray(c.pars)||c.pars.length!==18)throw new Error("Incomplete data — fill in manually");
      setName(c.name||name);setCity(c.city||city);setState(c.state||state);
      setSlope(""+c.slope);setRating(""+c.rating);
      setPars(c.pars.map(p=>parseInt(p)||4));
      setYardages(c.yardages?c.yardages.map(y=>""+y):Array(18).fill(""));
      setSearchErr("FOUND");
    }catch(e){
      if(e.message.includes("rate limit"))setSearchErr("Rate limit hit — wait 60 seconds and try again.");
      else setSearchErr("Error: "+e.message);
    }
    setSearching(false);
  }

  function finish(){
    const c={name:name.trim(),city,state,slope:parseFloat(slope)||113,rating:parseFloat(rating)||72,
      pars,yardages:yardages.map(v=>parseInt(v)||0),id:""+Date.now()};
    onSave(c);onSelect(c);
  }

  if(view==="list")return h("div",{style:{paddingBottom:80}},
    h(Hdr,{title:"Select Course",back}),
    h("div",{style:{margin:"12px 14px 4px"}},
      h("button",{onClick:()=>{setView("new");setStep(0);},style:bs({background:GOLD,color:GG,width:"100%",padding:"11px"})},"+ Add New Course")
    ),
    saved.map(c=>h("div",{key:c.id,onClick:()=>onSelect(c),style:cs({cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px"})},
      h("div",null,
        h("div",{style:{fontWeight:700,fontSize:15}},c.name),
        h("div",{style:{color:MUTED,fontSize:13}},(c.city||"")+(c.state?", "+c.state:"")+(c.slope?" · Slope "+c.slope:"")),
        h("div",{style:{color:MUTED,fontSize:12,marginTop:2}},"Par "+(c.pars?c.pars.reduce((a,b)=>a+b,0):72))
      ),
      h("span",{style:{fontSize:20,color:GG}},"→")
    ))
  );

  // Step 0: Name + lookup
  if(step===0)return h("div",{style:{paddingBottom:80}},
    h(Hdr,{title:"New Course",back:saved.length>0?()=>setView("list"):back}),
    h("div",{style:cs()},
      h("label",{style:LBL},"Course Name"),
      h("input",{value:name,onChange:e=>setName(e.target.value),placeholder:"e.g. Indian Peaks Golf Course",style:ins({marginBottom:10})}),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        h("div",null,h("label",{style:LBL},"City"),h("input",{value:city,onChange:e=>setCity(e.target.value),placeholder:"Boulder",style:ins()})),
        h("div",null,h("label",{style:LBL},"State"),h("input",{value:state,onChange:e=>setState(e.target.value),placeholder:"CO",style:ins()}))
      ),
      // Auto-lookup button
      h("button",{
        onClick:lookupCourse,disabled:!name.trim()||searching,
        style:bs({background:GOLD,color:GG,width:"100%",marginBottom:10,opacity:(!name.trim()||searching)?.5:1})
      },searching?"Searching...":"Search for Course Data Automatically"),
      searchErr&&searchErr!=="FOUND"&&searchErr!=="FOUND_GHIN"&&searchErr!=="FOUND_GC"&&h("div",{style:{color:NEG,fontSize:12,marginBottom:10,lineHeight:1.5}},searchErr),
      (searchErr==="FOUND_GC"||searchErr==="FOUND_GHIN")&&h("div",{style:{background:"#f0f9f4",border:"1px solid #c3e6d0",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:POS,lineHeight:1.5}},
        h("strong",null,"Course found! "),h("span",{style:{color:MUTED}},"Official data — review and correct pars/yardages on the next screen if needed.")
      ),
      searchErr==="FOUND"&&h("div",{style:{background:"#f0f9f4",border:"1px solid #c3e6d0",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:POS,lineHeight:1.5}},
        h("strong",null,"Course found! "),h("span",{style:{color:MUTED}},"AI-estimated — verify pars/yardages before starting.")
      ),
      // Manual slope/rating if not auto-filled
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:6}},
        h("div",null,h("label",{style:LBL},"Slope"),h("input",{type:"number",value:slope,onChange:e=>setSlope(e.target.value),placeholder:"128",style:ins()})),
        h("div",null,h("label",{style:LBL},"Rating"),h("input",{type:"number",step:"0.1",value:rating,onChange:e=>setRating(e.target.value),placeholder:"71.4",style:ins()}))
      ),
      h("div",{style:{fontSize:12,color:MUTED,marginBottom:14}},"Search auto-fills slope, rating, pars and yardages. You can also fill manually below."),
      h("button",{onClick:()=>setStep(1),disabled:!canGo,style:bs({width:"100%",opacity:canGo?1:.4})},"Next: Review Pars & Yardages →")
    )
  );

  // Step 0.5: Tee selection (when API returns multiple tees)
  if(step===0.5)return h("div",{style:{paddingBottom:80}},
    h(Hdr,{title:"Select Tees",back:()=>setStep(0)}),
    h("div",{style:{margin:"12px 14px 4px"}},
      h("div",{style:{...SERIF,fontSize:16,fontWeight:700,color:GG,marginBottom:2}},name),
      h("div",{style:{fontSize:13,color:MUTED,marginBottom:12}},"Select the tees you are playing")
    ),
    h("div",{style:{margin:"0 14px"}},
      teeOptions.map((t,ti)=>{
        const td=rawHoles[ti]||{};
        const teeName=t.tee_name||t.name||"Tee "+(ti+1);
        const totalYds=td.totalYds||0;
        const sl=td.slope||0;const rt=td.rating||0;
        const par=td.par||72;
        return h("div",{key:ti,
          onClick:()=>{
            const d=rawHoles[ti]||{};
            setPars(d.pars||Array(18).fill(4));
            setYardages((d.yardages||Array(18).fill(0)).map(y=>""+y));
            setSlope(d.slope?""+d.slope:"");
            setRating(d.rating?""+d.rating:"");
            setStep(1);
          },
          style:{
            padding:"16px 18px",marginBottom:1,cursor:"pointer",
            background:CARD,borderBottom:"1px solid "+BORDER,
            display:"flex",justifyContent:"space-between",alignItems:"center",
            borderRadius:ti===0?"10px 10px 0 0":ti===teeOptions.length-1?"0 0 10px 10px":"0"
          }},
          h("div",null,
            h("div",{style:{fontSize:17,fontWeight:700,color:"#222"}},
              teeName+(totalYds?" ("+totalYds.toLocaleString()+" yds)":"")
            ),
            h("div",{style:{fontSize:13,color:MUTED,marginTop:3}},
              (rt&&sl?rt+"/"+sl:"")+(rt&&sl?" \u2022 ":"")+"Par "+par
            )
          ),
          h("span",{style:{fontSize:20,color:"#ccc"}},"›")
        );
      })
    )
  );

  // Step 1: Pars + yardages in combined table
  return h("div",{style:{paddingBottom:80}},
    h(Hdr,{title:"Pars & Yardages",back:()=>setStep(teeOptions.length>1?0.5:0)}),
    h("div",{style:cs()},
      h("div",{style:{...SERIF,fontSize:16,fontWeight:700,color:GG,marginBottom:3}},name),
      h("div",{style:{fontSize:13,color:MUTED,marginBottom:12}},
        "Tap par to cycle 3/4/5 · Enter/Tab moves to next yardage · Total par: ",
        h("strong",{style:{color:GG}},totalPar)
      ),
      [0,1].map(row=>h("div",{key:row,style:{marginBottom:12}},
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(9,1fr)",gap:4}},
          Array.from({length:9},(_,i)=>{
            const idx=row*9+i;
            return h("div",{key:idx,style:{display:"flex",flexDirection:"column",alignItems:"center",gap:3}},
              h("div",{style:{fontSize:10,color:MUTED,fontWeight:700,textAlign:"center"}},idx+1),
              h("button",{onClick:()=>cyclePar(idx),style:{
                width:"100%",padding:"5px 0",borderRadius:6,
                border:"2px solid "+PAR_C[pars[idx]],background:PAR_BG[pars[idx]],
                color:PAR_C[pars[idx]],fontSize:14,fontWeight:800,cursor:"pointer"
              }},pars[idx]),
              h("input",{
                ref:el=>{yardRefs.current[idx]=el;},
                type:"number",value:yardages[idx],
                onChange:e=>setYard(idx,e.target.value),
                onKeyDown:e=>{
                  if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();yardRefs.current[idx+1]?.focus();}
                },
                placeholder:"yds",
                style:{width:"100%",padding:"3px 2px",border:"1px solid "+BORDER,borderRadius:4,fontSize:11,textAlign:"center",background:"#fff",outline:"none",color:"#222"}
              })
            );
          })
        )
      )),
      h("div",{style:{fontSize:12,color:MUTED,marginBottom:12,textAlign:"center"}},"Yardages optional — can enter from GPS during round"),
      h("button",{onClick:finish,style:bs({background:GOLD,color:GG,width:"100%",fontSize:15})},"Start Round →")
    )
  );
}

// ── INLINE SHOT ENTRY ────────────────────────────────────────────
// This replaces the modal — all entry is inline on the hole card
function ShotEntry({hole,shotNum,prevShot,onSave}){
  const isFirst=shotNum===1;
  const autoLie=isFirst?"Tee":prevShot?prevShot.resultLie:"Tee";
  const autoStart=isFirst
    ?(hole.yardage?""+hole.yardage:"")
    :prevShot
      ?(prevShot.resultLie==="OB/Penalty"?"":prevShot.remainDist!=null?""+prevShot.remainDist:"")
      :"";
  const startLie=isFirst?"Tee":prevShot?.resultLie==="OB/Penalty"?"Tee":autoLie==="OB/Penalty"?"Tee":autoLie;

  const [lie,setLie]=useState(startLie);
  const [startDist,setStartDist]=useState(autoStart);
  const [shotDist,setShotDist]=useState("");
  const [club,setClub]=useState(startLie==="Green"?"Putter":"");
  const [result,setResult]=useState("");
  const [remainDist,setRemainDist]=useState("");
  const [dir,setDir]=useState("");

  const isPutt=lie==="Green";
  const isHoled=result==="Holed";
  const isOB=result==="OB/Penalty";
  const canSave=startDist&&club&&result&&(isHoled||isOB||remainDist);

  function save(){
    if(!canSave)return;
    onSave({lie,startDist:parseFloat(startDist),shotDist:shotDist?parseFloat(shotDist):null,club,resultLie:result,direction:dir||null,remainDist:isHoled?0:isOB?null:parseFloat(remainDist),penalty:isOB?1:0});
  }

  const pill=(label,active,color,onClick,small)=>h("button",{onClick,style:{
    padding:small?"5px 9px":"7px 12px",borderRadius:16,
    border:"1.5px solid "+(active?color:BORDER),
    background:active?color:CARD,color:active?(color===GOLD?GG:"#fff"):GG,
    fontSize:small?11:13,fontWeight:600,cursor:"pointer"
  }},label);

  return h("div",{style:{background:"#f9f6f0",borderRadius:10,padding:12,marginTop:8,border:"1px solid "+BORDER}},
    h("div",{style:{fontSize:11,fontWeight:800,color:GG,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},
      "Shot "+shotNum+(isFirst?" — Tee":"")
    ),

    // Lie (hidden for first shot — always Tee)
    !isFirst&&h("div",{style:{marginBottom:8}},
      h("label",{style:LBL},"Lie"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
        SLIES.map(l=>pill(l,lie===l,GG,()=>{setLie(l);if(l==="Green")setClub("Putter");},true))
      )
    ),

    // Distances row
    h("div",{style:{display:"grid",gridTemplateColumns:isPutt?"1fr":"1fr 1fr",gap:8,marginBottom:8}},
      h("div",null,
        h("label",{style:LBL},"Dist to Hole ("+(isPutt?"ft":"yds")+")"),
        h(NumInput,{value:startDist,onChange:setStartDist,placeholder:isPutt?"ft":"yds"})
      ),
      !isPutt&&h("div",null,
        h("label",{style:LBL},lie==="Tee"?"Drive Dist (yds)":"Shot Dist (yds) optional"),
        h(NumInput,{value:shotDist,onChange:setShotDist,placeholder:"e.g. 285"})
      )
    ),

    // Club
    h("div",{style:{marginBottom:8}},
      h("label",{style:LBL},"Club"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
        CLUBS.map(c=>h("button",{key:c,onClick:()=>setClub(c),style:{
          padding:"5px 9px",borderRadius:7,fontSize:12,fontWeight:700,cursor:"pointer",
          border:"1.5px solid "+(club===c?GG:BORDER),background:club===c?GG:CARD,color:club===c?"#fff":GG
        }},c))
      )
    ),

    // Result
    h("div",{style:{marginBottom:8}},
      h("label",{style:LBL},"Result"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
        ELIES.map(l=>h("button",{key:l,onClick:()=>setResult(l),style:{
          padding:"7px 12px",borderRadius:16,fontSize:13,fontWeight:600,cursor:"pointer",
          border:"1.5px solid "+(result===l?(l==="Holed"?GOLD:l==="OB/Penalty"?NEG:GG):BORDER),
          background:result===l?(l==="Holed"?GOLD:l==="OB/Penalty"?NEG:GG):CARD,
          color:result===l?(l==="Holed"?GG:"#fff"):GG
        }},l==="Holed"?"Holed":l))
      )
    ),

    // OB notice
    isOB&&h("div",{style:{background:"#fff0f0",border:"1px solid "+NEG,borderRadius:7,padding:"7px 10px",marginBottom:8,fontSize:12,color:NEG,fontWeight:600}},
      "OB / Penalty — +1 stroke added. Enter next shot from where you play."
    ),

    // Remaining distance
    !isHoled&&!isOB&&result&&h("div",{style:{marginBottom:8}},
      h("label",{style:LBL},"Remaining to Hole ("+(result==="Green"?"ft":"yds")+")"),
      h(NumInput,{value:remainDist,onChange:setRemainDist,placeholder:result==="Green"?"ft":"yds"})
    ),

    // Direction
    !isPutt&&!isHoled&&result&&h("div",{style:{marginBottom:8}},
      h("label",{style:LBL},"Direction (optional)"),
      h("div",{style:{display:"flex",gap:4}},
        DIRS.map(d=>h("button",{key:d,onClick:()=>setDir(dir===d?"":d),style:{
          flex:1,padding:"6px 2px",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"center",
          border:"1.5px solid "+(dir===d?GG:BORDER),background:dir===d?GG:CARD,color:dir===d?"#fff":GG
        }},d))
      )
    ),

    // Save
    h("button",{onClick:save,disabled:!canSave,style:bs({width:"100%",marginTop:4,opacity:canSave?1:.4,background:GOLD,color:GG})},
      "Save Shot "+shotNum+(isHoled?" — Hole Complete":"")
    )
  );
}

// ── INLINE PUTT ENTRY ────────────────────────────────────────────
function PuttEntry({hole,onSave}){
  const [n,setN]=useState("");const [d,setD]=useState("");
  const ok=n&&d&&parseInt(n)>0;
  return h("div",{style:{background:"#f0f9f4",borderRadius:10,padding:12,marginTop:8,border:"1px solid #c3e6d0"}},
    h("div",{style:{fontSize:11,fontWeight:800,color:POS,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Putting"),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
      h("div",null,
        h("label",{style:LBL},"Total Putts"),
        h("div",{style:{display:"flex",gap:5}},
          [1,2,3,4].map(num=>h("button",{key:num,onClick:()=>setN(""+num),style:{
            flex:1,padding:"10px 0",borderRadius:8,fontSize:16,fontWeight:800,cursor:"pointer",
            border:"2px solid "+(n==num?GG:BORDER),background:n==num?GG:CARD,color:n==num?"#fff":GG
          }},num))
        )
      ),
      h("div",null,
        h("label",{style:LBL},"First Putt (ft)"),
        h("div",{style:{fontSize:10,color:MUTED,marginBottom:3}},"Enter in feet"),
        h(NumInput,{value:d,onChange:setD,placeholder:"e.g. 24"})
      )
    ),
    h("button",{onClick:()=>ok&&onSave({totalPutts:parseInt(n),firstPuttDist:parseFloat(d)}),disabled:!ok,style:bs({width:"100%",background:POS,opacity:ok?1:.4})},
      "Log Putts & Complete Hole"
    )
  );
}

// ── ROUND ENTRY (ONE PAGE, ALL INLINE) ──────────────────────────
function RoundEntry({round,onComplete,back}){
  const [holes,setHoles]=useState(round.holes);
  const [activeIdx,setActiveIdx]=useState(0);
  const holeRefs=useRef([]);

  const done=holes.filter(h=>h.totalPutts!=null).length;
  const totalStrokes=holes.reduce((a,h)=>a+holeStrokes(h),0);
  const playedPar=holes.filter(h=>h.totalPutts!=null).reduce((a,h)=>a+h.par,0);
  const tp=totalStrokes-playedPar;

  function saveShot(idx,s){
    const u=holes.map((h,i)=>i===idx?{...h,shots:[...(h.shots||[]),s]}:h);
    setHoles(u);
  }
  function savePutts(idx,p){
    const u=holes.map((h,i)=>i===idx?{...h,...p}:h);
    setHoles(u);
    // auto-advance to next incomplete hole
    const next=u.findIndex((h,i)=>i>idx&&h.totalPutts==null);
    if(next>=0){
      setActiveIdx(next);
      setTimeout(()=>holeRefs.current[next]?.scrollIntoView({behavior:"smooth",block:"start"}),100);
    }
  }
  function undo(idx){
    setHoles(holes.map((h,i)=>{
      if(i!==idx)return h;
      if(h.totalPutts!=null)return{...h,totalPutts:null,firstPuttDist:null};
      return{...h,shots:(h.shots||[]).slice(0,-1)};
    }));
  }

  return h("div",{style:{paddingBottom:90}},
    // Header
    h("div",{style:{background:GG,color:"#fff",padding:"13px 16px",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
        h("button",{onClick:back,style:{background:"none",border:"none",color:"#fff",fontSize:22,cursor:"pointer",padding:0}},"←"),
        h("div",{style:{flex:1}},
          h("div",{style:{...SERIF,fontSize:16,fontWeight:700}},round.course.name),
          h("div",{style:{fontSize:12,opacity:.75}},done+"/18 complete · "+(totalStrokes===0?"—":fmt(tp)))
        ),
        done>=9&&h("button",{
          onClick:()=>onComplete({...round,holes}),
          style:{background:GOLD,color:GG,border:"none",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}
        },done===18?"Finish":"Finish Early")
      ),
      // Hole tabs
      h("div",{style:{display:"flex",gap:3,overflowX:"auto",paddingBottom:2}},
        holes.map((hh,i)=>{
          const comp=hh.totalPutts!=null;
          const s=holeStrokes(hh);const diff=comp?s-hh.par:null;
          return h("button",{key:i,onClick:()=>{setActiveIdx(i);setTimeout(()=>holeRefs.current[i]?.scrollIntoView({behavior:"smooth",block:"start"}),50);},style:{minWidth:28,height:28,borderRadius:5,border:"none",fontSize:11,fontWeight:700,position:"relative",cursor:"pointer",background:i===activeIdx?GOLD:comp?"rgba(255,255,255,.3)":"rgba(255,255,255,.08)",color:i===activeIdx?GG:"#fff"}},
            i+1,
            comp&&diff!==null&&diff!==0&&h("span",{style:{position:"absolute",top:-3,right:-3,fontSize:8,background:diff<0?POS:diff===1?"#e67e22":NEG,color:"#fff",borderRadius:3,padding:"0 2px",lineHeight:"13px"}},(diff>0?"+":"")+diff)
          );
        })
      )
    ),

    // All 18 holes inline
    holes.map((hole,i)=>{
      const comp=hole.totalPutts!=null;
      const isActive=i===activeIdx;
      const score=holeStrokes(hole);
      const diff=comp?score-hole.par:null;
      const prevShot=hole.shots?.length>0?hole.shots[hole.shots.length-1]:null;
      const showPutts=!comp&&(hole.shots?.length>0||hole.par===3);

      return h("div",{key:i,ref:el=>holeRefs.current[i]=el,style:{margin:"8px 14px",borderRadius:14,border:"2px solid "+(isActive?GOLD:comp?"#c3e6d0":BORDER),background:CARD,overflow:"hidden"}},
        // Hole header — tap to make active
        h("div",{onClick:()=>setActiveIdx(i),style:{
          display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"12px 14px",cursor:"pointer",
          background:comp?"#f0f9f4":isActive?"#fdf8ee":CARD
        }},
          h("div",null,
            h("div",{style:{...SERIF,fontSize:18,fontWeight:700,color:GG}},"Hole "+(i+1)),
            h("div",{style:{fontSize:13,color:MUTED}},"Par "+hole.par+(hole.yardage?" · "+hole.yardage+" yds":""))
          ),
          h("div",{style:{textAlign:"right"}},
            comp
              ?h("div",null,
                  h("div",{style:{fontSize:26,fontWeight:800,lineHeight:1,color:diff<0?POS:diff===0?GG:diff===1?"#e67e22":NEG}},score),
                  h("div",{style:{fontSize:11,color:MUTED}},fmt(diff)+" vs par")
                )
              :h("div",{style:{fontSize:13,color:MUTED,fontStyle:"italic"}},"tap to enter")
          )
        ),

        // Expanded content when active
        isActive&&h("div",{style:{padding:"0 12px 12px"}},
          // Shots logged so far
          (hole.shots||[]).map((s,si)=>h("div",{key:si,style:{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 10px",background:s.penalty?"#fff0f0":BG,borderRadius:8,marginBottom:4,border:s.penalty?"1px solid #ffcccc":"none"}},
            h("div",{style:{width:22,height:22,background:s.penalty?NEG:GG,color:"#fff",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,marginTop:1}},si+1),
            h("div",{style:{flex:1,fontSize:13}},
              h("div",{style:{fontWeight:700}},s.club+" — "+s.startDist+(s.lie==="Green"?"ft":"y")+" to hole"),
              h("div",{style:{color:MUTED,marginTop:1,fontSize:12}},
                s.shotDist?h("span",{style:{color:"#2563eb",fontWeight:700,marginRight:6}},"> "+s.shotDist+"y"):null,
                h("span",null,"→ "+s.resultLie),
                s.direction?h("span",{style:{background:"#e8f4fd",color:"#1a6ea8",borderRadius:3,padding:"1px 5px",fontSize:10,fontWeight:700,marginLeft:5}},s.direction):null,
                s.penalty?h("span",{style:{color:NEG,fontWeight:700,marginLeft:5}},"(+1)"):null
              )
            )
          )),

          // Putt summary if complete
          comp&&h("div",{style:{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#f0f9f4",borderRadius:8,marginBottom:4,border:"1px solid #c3e6d0"}},
            h("div",{style:{width:22,height:22,background:POS,color:"#fff",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}},"P"),
            h("div",{style:{fontSize:13}},
              h("span",{style:{fontWeight:700,color:POS}},hole.totalPutts+" putt"+(hole.totalPutts>1?"s":"")),
              h("span",{style:{color:MUTED,fontSize:12}}," · first putt: "+hole.firstPuttDist+"ft")
            )
          ),

          // Undo + next shot or putt entry
          h("div",{style:{display:"flex",gap:6,marginBottom:(hole.shots?.length>0||comp)?8:0}},
            (hole.shots?.length>0||comp)&&h("button",{onClick:()=>undo(i),style:bs({background:"#e8e0d4",color:GG,padding:"8px 14px",fontSize:13})},"↩ Undo")
          ),

          // Show shot entry if hole not complete
          !comp&&h(ShotEntry,{
            hole,
            shotNum:(hole.shots?.length||0)+1,
            prevShot,
            onSave:s=>saveShot(i,s)
          }),

          // Show putt entry when shots are done (or par 3 with no shots = chip+putt)
          !comp&&showPutts&&h(PuttEntry,{hole,onSave:p=>savePutts(i,p)})
        )
      );
    }),

    done>=9&&h("div",{style:{margin:"8px 14px"}},
      h("button",{onClick:()=>onComplete({...round,holes}),style:bs({background:GOLD,color:GG,width:"100%",fontSize:15})},
        done===18?"Complete Round":"Finish Early ("+done+" holes)"
      )
    )
  );
}

// ── AI COACHING COMPONENT ────────────────────────────────────────
function AICoaching({round,st,sg,tot}){
  const [ai,setAi]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  async function getAnalysis(){
    if(!getApiKey()){setErr("No API key — go to Settings (gear icon on home screen) to add your Anthropic API key.");return;}
    setBusy(true);setErr("");
    try{
      const payload={course:round.courseName,toPar:st.toPar,score:st.score,par:st.par,girPct:st.girPct,fwyPct:st.fwyPct,putts:st.putts,avgDrive:st.avgDrive,sgVsScratch:round.sgByBl?.scratch,sgVs5hdcp:round.sgByBl?.hdcp5,sgVs15hdcp:round.sgByBl?.hdcp15,clubsUsed:st.clubMap,holes:round.holes?.map(hh=>({hole:hh.holeNum,par:hh.par,score:holeStrokes(hh),shots:(hh.shots||[]).map(s=>({club:s.club,lie:s.lie,startDist:s.startDist,shotDist:s.shotDist,resultLie:s.resultLie,direction:s.direction||null,remainDist:s.remainDist,penalty:s.penalty||0})),totalPutts:hh.totalPutts,firstPuttDist:hh.firstPuttDist}))};
      const data=await callAI(
        [{role:"user",content:"Please give me a detailed golf coaching analysis for this round. Include: 1) Overall summary. 2) Club-by-club breakdown — which performed well vs poorly. 3) Strokes gained analysis vs all three baselines. 4) Top 2-3 specific practice drills based on weaknesses. 5) Any trends. Be specific and reference actual numbers.\n\nRound data: "+JSON.stringify(payload)}],
        "You are a PGA golf instructor. Give specific post-round coaching using the actual numbers. Cover: overall summary, club performance, strokes gained vs all baselines, top 2 practice drills. Be specific and encouraging. 4 paragraphs max."
      );
      setAi((data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""));
    }catch(e){
      if(e.message==="NO_KEY")setErr("No API key — go to Settings to add your Anthropic API key.");
      else setErr("Analysis failed: "+e.message+". Check your API key in Settings.");
    }
    setBusy(false);
  }

  if(ai)return h("div",{style:{fontSize:14,lineHeight:1.8,color:"#222",whiteSpace:"pre-wrap"}},ai);
  return h("div",null,
    err&&h("div",{style:{color:NEG,fontSize:12,marginBottom:8,lineHeight:1.5}},err),
    h("button",{onClick:getAnalysis,disabled:busy,style:bs({background:GOLD,color:GG,width:"100%",opacity:busy?.6:1})},
      busy?"Analyzing your round...":"Get Personalized Coaching Analysis"
    )
  );
}

      h("div",{style:{fontSize:13,color:MUTED,marginBottom:12}},"All round data is stored locally on this device."),
      h("button",{onClick:()=>{if(confirm("Delete all round history? Cannot be undone.")){localStorage.removeItem("gr");alert("Round history cleared.");}},style:bs({background:"#e8e0d4",color:NEG,width:"100%"})},"Clear Round History"),
      h("button",{onClick:()=>{if(confirm("Delete all saved courses?")){localStorage.removeItem("gc");alert("Courses cleared.");}},style:bs({background:"#e8e0d4",color:MUTED,width:"100%",marginTop:8})},"Clear Saved Courses")

// ── SUMMARY ──────────────────────────────────────────────────────
function Summary({round,back}){
  const [blKey,setBlKey]=useState("hdcp15");
  const sg=(round.sgByBl&&round.sgByBl[blKey])||(round.sg||{});

    h(Hdr,{title:round.courseName,sub:new Date(round.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),back}),

      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,textAlign:"center"}},
        [["Score",fmt(st.toPar||0),GOLD],["Putts",st.putts||"—","#fff"],["GIR%",(st.girPct||0)+"%","#fff"],["Drive",st.avgDrive?st.avgDrive+"y":"—","#fff"]].map(([l,v,c])=>
          h("div",{key:l},h("div",{style:{fontSize:22,fontWeight:800,color:c,lineHeight:1.1}},v),h("div",{style:{fontSize:10,opacity:.65,textTransform:"uppercase",fontWeight:700,letterSpacing:.8,marginTop:3}},l))
        )

    ),
    h("div",{style:cs()},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        h("div",{style:{...SERIF,fontSize:17,fontWeight:700,color:GG}},"Strokes Gained"),

      h(SGBar,{label:"Off Tee",val:sg.tee||0}),h(SGBar,{label:"Approach",val:sg.approach||0}),h(SGBar,{label:"Around Green",val:sg.around||0}),h(SGBar,{label:"Putting",val:sg.putting||0})
    ),
    h("div",{style:cs()},
      h("div",{style:{...SERIF,fontSize:16,fontWeight:700,color:GG,marginBottom:10}},"Scorecard"),
      [round.holes.slice(0,9),round.holes.slice(9)].map((nine,ni)=>
        h("div",{key:ni,style:{overflowX:"auto",marginBottom:ni===0?6:0}},

            h("thead",null,h("tr",{style:{background:GG,color:"#fff"}},
              h("th",{style:{padding:"4px 5px",textAlign:"center"}},"H"),
              nine.map(hh=>h("th",{key:hh.holeNum,style:{padding:"4px 5px",textAlign:"center"}},hh.holeNum)),
              h("th",{style:{padding:"4px 5px",textAlign:"center",background:ni===1?GOLD:"rgba(255,255,255,.15)",color:ni===1?GG:"#fff"}},ni===0?"Out":"Tot")
            )),
            h("tbody",null,
              h("tr",{style:{background:BG}},
                h("td",{style:{padding:"4px 5px",textAlign:"center",fontWeight:700,color:GG}},"Par"),
                nine.map(hh=>h("td",{key:hh.holeNum,style:{padding:"4px 5px",textAlign:"center"}},hh.par)),
                h("td",{style:{padding:"4px 5px",textAlign:"center",fontWeight:800}},nine.reduce((a,hh)=>a+hh.par,0))
              ),
              h("tr",null,
                h("td",{style:{padding:"4px 5px",textAlign:"center",fontWeight:700,color:GG}},"Score"),
                nine.map(hh=>{const s=holeStrokes(hh);const d=s-hh.par;return h("td",{key:hh.holeNum,style:{padding:"4px 5px",textAlign:"center",fontWeight:s?700:400,color:d<0?POS:d===1?"#e67e22":d>=2?NEG:"#222"}},s||"—");}),
                h("td",{style:{padding:"4px 5px",textAlign:"center",fontWeight:800}},ni===1?st.score:nine.reduce((a,hh)=>a+holeStrokes(hh),0))
              ),
              h("tr",null,
                h("td",{style:{padding:"4px 5px",textAlign:"center",fontWeight:700,color:GG}},"Putts"),
                nine.map(hh=>h("td",{key:hh.holeNum,style:{padding:"4px 5px",textAlign:"center",color:MUTED,fontSize:11}},hh.totalPutts||"—")),

    rounds.length===0?h("div",{style:cs({textAlign:"center",padding:40,color:MUTED})},"No rounds logged yet."):

// ── DASHBOARD ────────────────────────────────────────────────────
function Dashboard({rounds,onNew,onHistory,onView,onSettings}){
  const recent=rounds.slice(0,10);
  const avg=k=>recent.length?+(recent.reduce((a,r)=>a+((r.sg&&r.sg[k])||0),0)/recent.length).toFixed(2):0;
  const sga={tee:avg("tee"),approach:avg("approach"),around:avg("around"),putting:avg("putting")};
  const last=recent[0];
  const scoreHist=()=>{
    if(recent.length<2)return null;
    const items=[...recent].reverse().slice(-8);
    const mx=Math.max(...items.map(r=>Math.abs(r.stats?.toPar||0)))+1;
    return h("div",{style:cs()},
      h("div",{style:{...SERIF,fontSize:16,fontWeight:700,color:GG,marginBottom:10}},"Score History"),
      h("div",{style:{display:"flex",gap:4,alignItems:"flex-end",height:80,marginBottom:5}},
        items.map((r,i)=>{const tp=r.stats?.toPar||0;const hh=Math.round(Math.abs(tp)/mx*60)+14;return h("div",{key:i,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}},h("div",{style:{fontSize:9,fontWeight:800,color:tp<=0?POS:tp<=5?GG:NEG}},fmt(tp)),h("div",{style:{width:"100%",height:hh+"px",background:tp<=0?POS:tp<=5?GG:NEG,borderRadius:"3px 3px 0 0"}}));})
      ),
      h("div",{style:{display:"flex",gap:4}},items.map((_,i)=>h("div",{key:i,style:{flex:1,textAlign:"center",fontSize:9,color:MUTED}},"R"+(i+1))))
    );
  };
  return h("div",{style:{paddingBottom:90}},
    h("div",{style:{background:GG,padding:"22px 20px 20px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
      h("div",null,
        h("div",{style:{...SERIF,fontSize:26,fontWeight:700,color:GOLD}},"FairwaIQ"),
        h("div",{style:{color:"rgba(255,255,255,.65)",fontSize:13,marginTop:2}},"Your personal caddie & analyst")
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h(GhinBadge,null),
        h("button",{onClick:onSettings,style:{background:"none",border:"none",color:"rgba(255,255,255,.7)",fontSize:22,cursor:"pointer",padding:"4px"}},"⚙")
      )
    ),
    h("div",{style:{margin:"12px 14px 4px"}},h("button",{onClick:onNew,style:bs({background:GOLD,color:GG,width:"100%",fontSize:15,padding:"13px"})},"+ Start New Round")),
    rounds.length===0?h("div",{style:cs({textAlign:"center",padding:"36px 20px"})},
      h("div",{style:{fontSize:42,marginBottom:10}},"[ ]"),
      h("div",{style:{...SERIF,fontSize:18,color:GG,marginBottom:6}},"No rounds yet"),
      h("div",{style:{color:MUTED,fontSize:14,lineHeight:1.8}},"Tap Start New Round to begin.")
    ):h("div",null,
      last&&h("div",{onClick:()=>onView(last),style:cs({cursor:"pointer"})},
        h("div",{style:{fontSize:10,fontWeight:800,color:MUTED,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Last Round · "+last.courseName),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}},
          [["Score",last.stats?fmt(last.stats.toPar):"—",last.stats?.toPar<=0?POS:NEG],["Putts",last.stats?.putts||"—",GG],["GIR%",(last.stats?.girPct||0)+"%",GG],["Drive",last.stats?.avgDrive?last.stats.avgDrive+"y":"—",GG]].map(([l,v,c])=>
            h("div",{key:l,style:{background:BG,borderRadius:9,padding:"9px 4px",textAlign:"center"}},
              h("div",{style:{fontSize:18,fontWeight:800,color:c}},v),
              h("div",{style:{fontSize:10,color:MUTED,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginTop:2}},l)
            )
          )
        )
      ),
      h("div",{style:cs()},
        h("div",{style:{...SERIF,fontSize:16,fontWeight:700,color:GG,marginBottom:10}},"Strokes Gained Avg ("+recent.length+" round"+(recent.length>1?"s":"")+")"),
        h(SGBar,{label:"Off Tee",val:sga.tee}),h(SGBar,{label:"Approach",val:sga.approach}),h(SGBar,{label:"Around Green",val:sga.around}),h(SGBar,{label:"Putting",val:sga.putting})
      ),
      scoreHist(),
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"12px 14px 4px"}},
        h("div",{style:{...SERIF,fontSize:17,fontWeight:700,color:GG}},"Recent Rounds"),
        h("button",{onClick:onHistory,style:{background:"none",border:"none",color:GG,fontSize:13,fontWeight:700,cursor:"pointer"}},"See All →")
      ),
      recent.slice(0,5).map(r=>h("div",{key:r.id,onClick:()=>onView(r),style:cs({cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 16px"})},
        h("div",null,h("div",{style:{fontWeight:700,fontSize:15}},r.courseName),h("div",{style:{color:MUTED,fontSize:13}},new Date(r.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})),h("div",{style:{fontSize:12,color:MUTED,marginTop:2}},"SG "+(r.sg?(r.sg.total>0?"+":"")+r.sg.total:"—")+" · "+(r.stats?.putts||0)+" putts")),
        h("div",{style:{textAlign:"right"}},h("div",{style:{fontSize:22,fontWeight:800,color:r.stats?.toPar<=0?POS:r.stats?.toPar<=6?GG:NEG}},r.stats?fmt(r.stats.toPar):"—"),h("div",{style:{fontSize:11,color:MUTED}},r.stats?.score))
      ))
    )
  );
}

// ── APP ──────────────────────────────────────────────────────────
function App(){
  const [pg,setPg]=useState("home");
  const [rounds,setRounds]=useState([]);const [courses,setCourses]=useState([]);
  const [activeRound,setActiveRound]=useState(null);const [viewRound,setViewRound]=useState(null);
  const [ready,setReady]=useState(false);
  useEffect(()=>{setRounds(sGet("gr")||[]);setCourses(sGet("gc")||[]);setReady(true);},[]);
  function saveRound(r){const u=[r,...rounds.filter(x=>x.id!==r.id)];setRounds(u);sSet("gr",u);}
  function saveCourse(c){const u=[c,...courses.filter(x=>x.id!==c.id)];setCourses(u);sSet("gc",u);}
  if(!ready)return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:BG,...SERIF,fontSize:20,color:GG}},"Loading...");
  const nav=h("div",{style:{position:"fixed",bottom:0,left:0,right:0,background:GG,display:"flex",borderTop:"3px solid "+GOLD,zIndex:100}},
    [["home","H","Home"],["history","S","History"]].map(([id,ic,lb])=>
      h("button",{key:id,onClick:()=>setPg(id),style:{flex:1,padding:"10px 0",background:"none",border:"none",cursor:"pointer",color:pg===id?GOLD:"rgba(255,255,255,.5)",fontSize:11,fontWeight:700}},
        h("div",{style:{fontSize:13,fontWeight:800}},ic),lb
      )
    )
  );
  return h("div",{style:{minHeight:"100vh",background:BG,maxWidth:520,margin:"0 auto",position:"relative"}},
    pg==="home"&&h(Dashboard,{rounds,onNew:()=>setPg("course"),onHistory:()=>setPg("history"),onView:r=>{setViewRound(r);setPg("summary");},onSettings:()=>setPg("settings")}),
    pg==="settings"&&h(Settings,{back:()=>setPg("home")}),
    pg==="course"&&h(CourseSelector,{saved:courses,onSave:saveCourse,onSelect:c=>{
      setActiveRound({course:c,courseName:c.name,holes:Array.from({length:18},(_,i)=>({holeNum:i+1,par:(c.pars&&c.pars[i])||4,yardage:(c.yardages&&c.yardages[i])||0,shots:[]}))});
      setPg("entry");
    },back:()=>setPg("home")}),
    pg==="entry"&&activeRound&&h(RoundEntry,{round:activeRound,onComplete:done=>{
      const sgByBl={scratch:calcSG(done.holes,"scratch"),hdcp5:calcSG(done.holes,"hdcp5"),hdcp15:calcSG(done.holes,"hdcp15")};
      const sg=sgByBl.hdcp15;const stats=calcStats(done.holes);
      const f={...done,id:""+Date.now(),date:new Date().toISOString(),sg:{...sg,total:+((sg.tee+sg.approach+sg.around+sg.putting)).toFixed(2)},sgByBl,stats};
      saveRound(f);setViewRound(f);setPg("summary");
    },back:()=>setPg("course")}),
    pg==="summary"&&viewRound&&h(Summary,{round:viewRound,back:()=>setPg("home")}),
    pg==="history"&&h(History,{rounds,onSelect:r=>{setViewRound(r);setPg("summary");},back:()=>setPg("home")}),
    (pg==="home"||pg==="history")&&nav
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
